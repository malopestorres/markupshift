name: Feature request
description: Suggest an improvement or a new conversion capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Input and expected output
      description: If relevant, include a minimal HTML input and the JSX or TSX you expect.
